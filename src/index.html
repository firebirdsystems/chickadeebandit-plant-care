<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Care</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: var(--bg);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 640px; margin: 0 auto; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding: 14px 18px;
      background: var(--accent); border-radius: var(--radius); color: var(--accent-fg);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 1px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-icon { background: rgba(255,255,255,.2); color: white; border: none; font-size: 1.2rem; padding: 6px 10px; border-radius: 8px; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    .plant-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .plant-tab {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--muted);
    }
    .plant-tab.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

    .activity-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      display: flex; flex-direction: column;
    }
    .card-body { padding: 14px 16px 10px; flex: 1; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .card-icon { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
    .card-name { font-weight: 700; font-size: 1rem; flex: 1; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--status-color, #6b7280); flex-shrink: 0; }
    .card-label { font-size: 0.85rem; font-weight: 600; color: var(--status-color, var(--muted)); margin-bottom: 6px; }
    .card-last-by {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px; font-size: 0.8rem; color: var(--muted);
    }
    .card-last-by .by-avatar {
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .card-last-by strong { color: var(--text); font-weight: 600; }
    .progress-track { height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0 4px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: var(--status-color, var(--muted));
      width: calc(var(--status-pct, 0) * 100%);
      transition: width .4s ease, background .4s ease;
    }
    .done-btn {
      width: 100%; padding: 11px; border: none;
      font-size: 0.9rem; font-weight: 700; color: white; cursor: pointer;
      background: var(--status-color, #6b7280);
      transition: opacity .15s, background .4s ease; letter-spacing: .02em;
    }
    .done-btn:active { opacity: .8; }
    .done-btn:hover { opacity: .92; }

    .tabs {
      display: flex; gap: 4px; background: var(--border); border-radius: 10px; padding: 3px; margin-bottom: 14px;
    }
    .tab { flex: 1; padding: 7px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: transparent; transition: all .15s; }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    @media (min-width: 480px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal { background: var(--card); border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 520px; padding: 22px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
      font-size: 0.95rem; outline: none; transition: border-color .15s; background: var(--card); font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .muted-label { font-weight: 400; text-transform: none; color: var(--muted); }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-btn { width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); font-size: 1.2rem; cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
    .emoji-btn:hover { border-color: var(--accent); background: var(--accent-light); }
    .emoji-btn.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 2px var(--accent); }

    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }

    .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .settings-header h3 { font-size: 1.1rem; font-weight: 700; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .info { flex: 1; font-size: 0.88rem; }
    .settings-row .sched-meta { font-size: 0.78rem; color: var(--muted); }
    .act-list { margin: 4px 0 6px 10px; padding-left: 10px; border-left: 2px solid var(--border); }
    .act-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .act-row:last-child { border-bottom: none; }
    .act-row .info { flex: 1; font-size: 0.83rem; }

    .form-group input[type="date"],
    .form-group textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 0.95rem; outline: none;
      transition: border-color .15s; background: var(--card); font-family: inherit; color: var(--text);
    }
    .form-group textarea { min-height: 90px; resize: vertical; }
    .form-group textarea:focus, .form-group input[type="date"]:focus { border-color: var(--accent); }
    .date-row { display: flex; gap: 10px; }
    .date-row > div { flex: 1; }
    .check-list { display: flex; flex-direction: column; gap: 10px; }
    .check-group { display: flex; flex-direction: column; gap: 6px; }
    .check-group-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .check-opt { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
    .check-opt input { accent-color: var(--accent); width: 16px; height: 16px; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
    .sit-row .info .sched-meta { display: block; }
    .form-error { color: #dc2626; font-size: 0.85rem; margin-top: 8px; }
    .form-group .check-opt {
      display: flex; margin: 0; text-transform: none; letter-spacing: 0;
      font-size: 0.9rem; font-weight: 500; color: var(--text);
    }

    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .empty-sm { font-size: 0.85rem; color: var(--muted); padding: 8px 0; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .muted { color: var(--muted); }
  </style>
  <base href="/run/plant-care/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>
<script type="module">
import {
  hubAlert, memberColor, initial, esc, isAdult, hubConfirm,
  createShareHelper, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS,
} from "/hub-sdk.js";
import {
  formatDuration, statusColor, activityStatusFromLog, isoToLocalDateInput,
  lastDoneToSave, schedLabel, sitSyncBlocksShare, planSitLinkRevoke, sitPlantIds, sitIsOpen, sitTaskRows,
  sitTaskStatements, sitDates, sitExpiryChoice, plantsByLocation, CARE_SNAPSHOT_STATEMENTS, parseCareSnapshot,
  refreshSitChecklists, SIT_MAX_TASKS,
} from "./logic.js";
import { createShareUi, createOverlayView } from "./share.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const EVENTS  = window.__EVENTS_URL  ?? "";

// Best-effort: the log row is already written, so a failed publish must never
// throw into markDone's catch and revert the optimistic update.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // ignored on purpose
  }
}
const ME      = window.__CURRENT_MEMBER ?? null;

let members        = [];
let plants         = [];
let activities     = []; // all activities across all plants
let lastLogs       = {};
let selectedId     = null;
let actFormPlantId = null; // plant context for the open activity form
let refreshTimer   = null;
let sits           = []; // sitter links' sits, newest first
let sitTasks       = {}; // sitId → its checklist rows, in display order
let sitTooMany     = {}; // sitId → the task count it would have, past SIT_MAX_TASKS

// ─── Sitter share links (manifest.shareable.sit) ──────────────────────────
// A sit is a public checklist for a plant-sitter who is not a member: each
// tick lands in logs with done_by "sitter", so it clears overdue like a
// member's tap. Only adults create sits (sits are adult_writable) and mint
// links. Same shape as pet-care's.
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share,
  itemType: "sit",
  noun: "sit",
  writable: true,
  writableVerb: "tick off tasks",
  scopeHtml: () => "The page shows the sit’s dates and instructions, and each chosen plant’s tasks with their schedule, location and when each was last done. The sitter types their name when they tick a task; it shows in your plants’ history. <strong>Anyone with the link can see the instructions — add a password if they include a door code.</strong>",
  esc,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks,
  expiryChoices: SHARE_EXPIRY_CHOICES,
  defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  // Looked up by id: the sit's dates can change while the panel is open.
  expiryFor: (item) => sitExpiryChoice(sits.find(x => x.id === item.id)),
  getMe: () => ME,
  isAdmin: () => window.__IS_ADMIN === true,
  memberName: (id) => members.find(m => m.id === id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  return res.json();
}

/** One atomic /api/db batch: every statement applies, or none does. */
async function dbBatch(statements) {
  if (!DB) return [];
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "Could not save");
  return body.results ?? [];
}

async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

async function loadMembers() {
  if (!CONTEXT) { members = [{ id: "demo-1", name: "Alex", role: "adult" }, { id: "demo-2", name: "Jordan", role: "child" }]; return; }
  try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; } catch { members = []; }
}
async function loadPlants() { const { rows } = await db(`SELECT * FROM app_plant_care__plants ORDER BY created_at`); plants = rows ?? []; }
async function loadActivities() {
  const { rows } = await db(`SELECT * FROM app_plant_care__activities ORDER BY plant_id, sort_order, created_at`);
  activities = rows ?? [];
}
async function loadLastLogs() {
  lastLogs = {};
  const curActs = activities.filter(a => a.plant_id === selectedId);
  if (!curActs.length) return;
  const ids = curActs.map(a => a.id);
  const ph  = ids.map(() => "?").join(",");
  const { rows } = await db(`SELECT l.* FROM app_plant_care__logs l INNER JOIN (SELECT activity_id, MAX(done_at) AS mx FROM app_plant_care__logs WHERE activity_id IN (${ph}) GROUP BY activity_id) m ON l.activity_id = m.activity_id AND l.done_at = m.mx`, ids);
  for (const r of rows ?? []) lastLogs[r.activity_id] = r;
}

// ─── Status ───────────────────────────────────────────────────────────────
function activityStatus(activity) {
  return activityStatusFromLog(activity, lastLogs[activity.id], members);
}

// ─── Actions ──────────────────────────────────────────────────────────────
async function markDone(activityId) {
  if (!ME) return;
  const id      = crypto.randomUUID();
  const now     = new Date().toISOString();
  const prevLog = lastLogs[activityId];

  // Optimistic update: reflect immediately, write to DB in background
  lastLogs[activityId] = { id, activity_id: activityId, plant_id: selectedId, done_by: ME.id, done_at: now };
  renderMain();

  try {
    // db() resolves with the hub's { error } on a refused write rather than
    // throwing, so check it: the optimistic tick must come back off.
    const res = await db(`INSERT INTO app_plant_care__logs (id, activity_id, plant_id, done_by, done_at) VALUES (?, ?, ?, ?, ?)`, [id, activityId, selectedId, ME.id, now]);
    if (res?.error) throw new Error(res.error);
    // Prune old logs in background — no effect on UI state. A sitter's ticks
    // are kept: they are the sit's record, shown on its share page.
    db(`DELETE FROM app_plant_care__logs WHERE activity_id = ? AND id != ? AND sit_id = ''`, [activityId, id]).catch(() => {});
    const act   = activities.find(a => a.id === activityId);
    const plant = plants.find(p => p.id === selectedId);
    await publishEvent("plant_care.logged", id, {
      activity: act?.name ?? "",
      plant: plant?.name ?? "",
      done_by: ME.id,
      done_at: now,
    });
  } catch {
    // Revert on INSERT failure
    if (prevLog) lastLogs[activityId] = prevLog;
    else delete lastLogs[activityId];
    renderMain();
  }
}

async function savePlant(fields, id = null) {
  const now = new Date().toISOString();
  if (id) {
    await db(`UPDATE app_plant_care__plants SET name = ?, type = ?, emoji = ?, location = ? WHERE id = ?`, [fields.name, fields.type, fields.emoji, fields.location, id]);
    plants = plants.map(p => p.id === id ? { ...p, ...fields } : p);
  } else {
    const newId = crypto.randomUUID();
    await db(`INSERT INTO app_plant_care__plants (id, name, type, emoji, location, created_at) VALUES (?, ?, ?, ?, ?, ?)`, [newId, fields.name, fields.type, fields.emoji, fields.location, now]);
    plants = [...plants, { id: newId, ...fields, created_at: now }];
    if (!selectedId) selectedId = newId;
    const wId = crypto.randomUUID(), fId = crypto.randomUUID();
    await db(`INSERT INTO app_plant_care__activities (id, plant_id, name, icon, interval_days, sort_order, created_at) VALUES (?, ?, 'Watering', '💧', 7, 0, ?)`, [wId, newId, now]);
    await db(`INSERT INTO app_plant_care__activities (id, plant_id, name, icon, interval_days, sort_order, created_at) VALUES (?, ?, 'Fertilizing', '🧪', 30, 1, ?)`, [fId, newId, now]);
    activities = [...activities,
      { id: wId, plant_id: newId, name: "Watering",    icon: "💧", interval_days: 7,  sort_order: 0, created_at: now },
      { id: fId, plant_id: newId, name: "Fertilizing", icon: "🧪", interval_days: 30, sort_order: 1, created_at: now },
    ];
  }
}

async function deletePlant(id) {
  if (!await hubConfirm({ message: "Delete this plant?", description: "All care data for this plant will be permanently removed.", confirmLabel: "Delete plant" })) return false;
  // One statement: manifest delete_cascades takes the plant's activities and
  // logs with it inside the same transactional batch. This used to be three
  // separate calls with the parent going first, so a failure (or a closed tab)
  // after the first left activities and logs orphaned under a plant that no
  // longer exists — invisible to the UI and to the recurring_due digest.
  await db(`DELETE FROM app_plant_care__plants WHERE id = ?`, [id]);
  plants = plants.filter(p => p.id !== id);
  activities = activities.filter(a => a.plant_id !== id);
  if (selectedId === id) { selectedId = plants[0]?.id ?? null; lastLogs = {}; if (selectedId) await loadLastLogs(); }
  return true;
}

async function saveActivity(fields, id = null) {
  const now = new Date().toISOString();
  const plantId = actFormPlantId ?? selectedId;
  if (id) {
    await db(`UPDATE app_plant_care__activities SET name = ?, icon = ?, interval_days = ? WHERE id = ?`, [fields.name, fields.icon, fields.interval_days, id]);
    activities = activities.map(a => a.id === id ? { ...a, ...fields } : a);
    if (fields.lastDoneAt) {
      // Never a sitter's tick: that is their record of the sit.
      const { rows } = await db(`SELECT id FROM app_plant_care__logs WHERE activity_id = ? AND sit_id = '' ORDER BY done_at DESC LIMIT 1`, [id]);
      const existing = rows?.[0]?.id;
      if (existing) {
        await db(`UPDATE app_plant_care__logs SET done_at = ? WHERE id = ?`, [fields.lastDoneAt, existing]);
      } else {
        const logId = crypto.randomUUID();
        await db(`INSERT INTO app_plant_care__logs (id, activity_id, plant_id, done_by, done_at) VALUES (?, ?, ?, ?, ?)`, [logId, id, plantId, ME.id, fields.lastDoneAt]);
      }
    }
  } else {
    const newId = crypto.randomUUID();
    const sortOrder = activities.filter(a => a.plant_id === plantId).length;
    await db(`INSERT INTO app_plant_care__activities (id, plant_id, name, icon, interval_days, sort_order, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)`, [newId, plantId, fields.name, fields.icon, fields.interval_days, sortOrder, now]);
    activities = [...activities, { id: newId, plant_id: plantId, ...fields }];
    if (fields.lastDoneAt) {
      const logId = crypto.randomUUID();
      await db(`INSERT INTO app_plant_care__logs (id, activity_id, plant_id, done_by, done_at) VALUES (?, ?, ?, ?, ?)`,
        [logId, newId, plantId, ME.id, fields.lastDoneAt]);
      lastLogs[newId] = { id: logId, activity_id: newId, plant_id: plantId, done_by: ME.id, done_at: fields.lastDoneAt };
    }
  }
}

async function deleteActivity(id) {
  if (!await hubConfirm({ message: "Delete this activity?", description: "The activity and its log history will be permanently removed.", confirmLabel: "Delete" })) return false;
  // The activity's logs go with it via delete_cascades (see deletePlant).
  await db(`DELETE FROM app_plant_care__activities WHERE id = ?`, [id]);
  activities = activities.filter(a => a.id !== id);
  delete lastLogs[id];
  return true;
}

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
/** `name` stamps data-testid on the dialog, so a UI scenario waits on the
 *  dialog it opened rather than on any modal. */
function openModal(html, name = "") {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal"${name ? ` data-testid="${name}"` : ""}>${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// ─── Render main ──────────────────────────────────────────────────────────
function renderCard(activity) {
  const { pct, label, lastBy } = activityStatus(activity);
  const color = statusColor(pct);
  const pctC  = Math.min(1, pct);
  let lastByHtml = "";
  if (lastBy) {
    const name = lastBy.name;
    const col  = memberColor(lastBy.member?.id ?? (lastBy.sitter ? "sitter" : ""), members);
    lastByHtml = `<div class="card-last-by" data-testid="card-last-by"><span class="by-avatar" style="background:${col}">${initial(name)}</span><span><strong>${esc(name)}</strong> · ${formatDuration(lastBy.agoD)} ago</span></div>`;
  } else {
    lastByHtml = `<div class="card-last-by" style="font-style:italic;color:var(--muted)">Never done</div>`;
  }
  return `
    <div class="activity-card" data-testid="activity-card" data-activity-id="${esc(activity.id)}" style="--status-color:${color};--status-pct:${pctC.toFixed(3)}">
      <div class="card-body">

// ─── Sits ─────────────────────────────────────────────────────────────────
function todayStr() { return isoToLocalDateInput(new Date().toISOString()); }

/** Plants, activities, sits and their checklists, read fresh in one batch.
 *  Throws when any read fails. Every checklist write is computed from this,
 *  never from the page's own `plants` and `activities`: those can be empty after
 *  a failed load, or hours old in a tab another adult has since edited past,
 *  and a checklist built from either would delete or resurrect tasks. */
async function readCare() {
  return parseCareSnapshot(await dbBatch(CARE_SNAPSHOT_STATEMENTS));
}

function applySits(snap) {
  sits = snap.sits;
  sitTasks = {};
  for (const row of snap.tasks) (sitTasks[row.sit_id] ??= []).push(row);
}

async function loadSits() {
  const snap = await readCare();
  applySits(snap);
  return snap;
}

/** Bring each open sit's checklist in line with its plants' activities — a
 *  renamed task, a changed schedule, an activity added or deleted — so the
 *  sitter's page follows edits. One atomic batch per sit that drifted. Adults
 *  only: sit_tasks is adult_writable. */
async function refreshOpenSits() {
  if (!isAdult(ME)) return { ok: true, failed: [], tooMany: {} };
  const { snap, changed, failed, tooMany } = await refreshSitChecklists({
    read: readCare, write: dbBatch, today: todayStr(), newId: () => crypto.randomUUID(),
  });
  applySits(snap);
  sitTooMany = tooMany;
  if (changed) await loadSits();
  return { ok: true, failed, tooMany };
}

/** Reload the sits and refresh their checklists, one run at a time. Never
 *  rejects: resolves to { ok, failed } — ok false when the read failed, and
 *  `failed` the sits whose rewrite was refused. Background callers ignore it
 *  (the next run retries); sharing checks it. */
let sitSync = Promise.resolve();
function syncSits() {
  if (!DB || !isAdult(ME)) return Promise.resolve({ ok: true, failed: [], tooMany: {} });
  const run = sitSync.then(refreshOpenSits).catch(() => ({ ok: false, failed: [], tooMany: {} }));
  sitSync = run;
  return run;
}

window.submitSit = async function(existingId) {
  if (!isAdult(ME)) return;
  const title        = document.getElementById("sf-title").value.trim();
  const starts_on    = document.getElementById("sf-start").value;
  const ends_on      = document.getElementById("sf-end").value;
  const instructions = document.getElementById("sf-instructions").value.trim();
  const plantIds     = [...modalEl.querySelectorAll(".sf-plant:checked")].map(i => i.value);
  const errEl        = document.getElementById("sf-error");
  errEl.textContent = "";
  if (!title) { document.getElementById("sf-title").focus(); return; }
  if (!plantIds.length) { errEl.textContent = "Pick at least one plant."; return; }
  if (starts_on && ends_on && ends_on < starts_on) { errEl.textContent = "The sit can’t end before it starts."; return; }

  const id = existingId || crypto.randomUUID();
  const plant_ids = JSON.stringify(plantIds);
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const statements = existingId
      ? [{ sql: "UPDATE app_plant_care__sits SET title = ?, instructions = ?, starts_on = ?, ends_on = ?, plant_ids = ? WHERE id = ?",
           params: [title, instructions, starts_on, ends_on, plant_ids, id] }]
      : [{ sql: "INSERT INTO app_plant_care__sits (id, title, instructions, starts_on, ends_on, plant_ids, created_by, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
           params: [id, title, instructions, starts_on, ends_on, plant_ids, ME.id, new Date().toISOString()] }];
    // The sit and its checklist land together, so a link never shows a sit
    // without its tasks. Built from a fresh read (see readCare).
    const care = await readCare();
    const rows = sitTaskRows({ plant_ids }, care.plants, care.activities);
    // The sitter's page offers at most SIT_MAX_TASKS; 100 tasks is 9 statements,
    // well inside the batch ceiling, so this is the limit that binds.
    if (rows.length > SIT_MAX_TASKS) {
      throw new Error(`A sit can have at most ${SIT_MAX_TASKS} tasks; this one would have ${rows.length}. Pick fewer plants.`);
    }
    statements.push(...sitTaskStatements(id, rows, () => crypto.randomUUID()));
    await dbBatch(statements);
    delete sitTooMany[id];
    await loadSits();
  } catch (e) {
    errEl.textContent = e?.message || "Could not save the sit.";
    if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Create sit"; }
    return;
  }
  renderSittersModal();
};

window.toggleSitArchived = async function(id) {
  const sit = sits.find(x => x.id === id);
  if (!sit || !isAdult(ME)) return;
  const archived = Number(sit.archived) === 1 ? 0 : 1;
  try {
    await dbBatch([{ sql: "UPDATE app_plant_care__sits SET archived = ? WHERE id = ?", params: [archived, id] }]);
    // A restored sit may have missed edits while it was archived.
    if (archived) await loadSits();
    else await syncSits();
  } catch (e) {
    hubAlert(e?.message || "Could not update the sit.");
  }
  renderSittersModal();
};

window.doDeleteSit = async function(id) {
  if (!isAdult(ME)) return;
  const ok = await hubConfirm({
    message: "Delete this sit?",
    description: "Its links stop working. The sitter’s ticks stay in your plants’ history.",
    confirmLabel: "Delete sit",
  });
  if (!ok) return;
  try {
    // delete_cascades takes the sit's checklist; logs are care history and stay.
    await dbBatch([{ sql: "DELETE FROM app_plant_care__sits WHERE id = ?", params: [id] }]);
    await loadSits();
  } catch (e) {
    hubAlert(e?.message || "Could not delete the sit.");
  }
  renderSittersModal();
};

window.shareSit = async function(id) {
  if (!isAdult(ME)) return;
  // The link shows the checklist as stored, so bring it up to date first, and
  // don't hand out a link to a checklist that could not be.
  const result = await syncSits();
  if (result.tooMany?.[id]) {
    hubAlert(`This sit has too many tasks (${result.tooMany[id]}) for a sitter’s page, which shows at most ${SIT_MAX_TASKS}. Edit it to pick fewer plants.`);
    return;
  }
  if (sitSyncBlocksShare(result, id)) {
    hubAlert("Couldn’t bring this sit’s tasks up to date, so a link could show old ones. Try again in a moment.");
    return;
  }
  const sit = sits.find(x => x.id === id);
  if (sit) shareUi.open({ id: sit.id, title: sit.title });
};

/** An archived sit's links are closed but still live: restoring the sit
 *  reopens them, so they count toward the household's link limit. The share
 *  panel would also offer to mint a link that could not open, so an archived
 *  sit gets this instead. */
window.revokeSitLinks = async function(id) {
  if (!isAdult(ME)) return;
  let links;
  try {
    const status = await share.listAll();
    if (!status || status.limits === null) throw new Error("refused");
    links = activeShareLinks(status.links, id);
  } catch {
    hubAlert("Couldn’t check this sit’s links. Try again in a moment.");
    return;
  }
  if (!links.length) { hubAlert("This sit has no live links."); return; }
  // Only a link's creator or an admin can revoke it: offer those, name the rest.
  const { mine, holders } = planSitLinkRevoke(links, { meId: ME?.id, isAdmin: window.__IS_ADMIN === true, members });
  const othersNote = holders.length
    ? ` ${links.length - mine.length === 1 ? "One link was" : `${links.length - mine.length} links were`} made by ${holders.join(" and ")}; they or an admin can revoke ${links.length - mine.length === 1 ? "it" : "them"}.`
    : "";
  if (!mine.length) {
    hubAlert(links.length === 1
      ? `This sit’s link was made by ${holders[0]}. They or an admin can revoke it.`
      : `This sit’s links were made by ${holders.join(" and ")}. They or an admin can revoke them.`);
    return;
  }
  const ok = await hubConfirm({
    message: `Revoke ${mine.length === 1 ? "this sit’s link" : `${mine.length} of this sit’s links`}?`,
    description: `Restoring the sit will no longer reopen ${mine.length === 1 ? "it" : "them"}. You can make a new link after restoring it.${othersNote}`,
    confirmLabel: "Revoke",
    destructive: true,
  });
  if (!ok) return;
  let failedCount = 0;
  for (const link of mine) {
    try { await share.revoke(link.id); } catch { failedCount++; }
  }
  if (failedCount) hubAlert(`Couldn’t revoke ${failedCount} of ${mine.length}. Try again.`);
};

window.openSitters = async function() {
  renderSittersModal();
  await syncSits();
  // Repaint only if the list is still what is on screen.
  if (modalEl?.querySelector("[data-testid='new-sit']")) renderSittersModal();
};
window.openSitForm = openSitForm;
window.toggleSitGroup = function(btn) {
  const boxes = [...btn.closest(".check-group").querySelectorAll(".sf-plant")];
  const on = !boxes.every(b => b.checked);
  for (const b of boxes) b.checked = on;
};

function handleDeepLink() {
  const plantId = new URLSearchParams(window.location.search).get("plantId");
  if (!plantId) return;
  const plant = plants.find(p => p.id === plantId);
  if (plant) window.selectPlant(plantId);
}

(async () => {
  await loadMembers();
  if (DB) { await initDb(); await Promise.all([loadPlants(), loadActivities()]); if (plants.length > 0) selectedId = plants[0].id; await loadLastLogs(); }
  renderMain();
  handleDeepLink();
  // Keep open sits' checklists current with the plants' activities. Off the
  // first paint: nothing on the main view depends on it.
  syncSits();
  refreshTimer = setInterval(() => { if (!modalEl) renderMain(); }, 60_000);
})();
</script>
</body>
